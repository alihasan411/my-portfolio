<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Quiz App</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #5f9cff, #6a11cb);
  color: white;
  transition: 0.4s;
}

.quiz-container {
  width: 90%;
  max-width: 400px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}

.progress {
  height: 8px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  margin-bottom: 15px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #00ffcc;
  border-radius: 10px;
  transition: 0.3s;
}

.option {
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: white;
  color: black;
}

.option:hover {
  transform: scale(1.03);
}

.correct {
  background: #00ff9d !important;
}

.wrong {
  background: #ff4d4d !important;
  color: white;
}

#nextBtn {
  margin-top: 10px;
  background: #00e5ff;
  color: black;
  padding: 10px;
  border: none;
  border-radius: 10px;
}

#modeToggle {
  position: absolute;
  top: 20px;
  right: 20px;
  border-radius: 50%;
  padding: 10px;
  border: none;
  cursor: pointer;
}

body.dark-mode {
  background: linear-gradient(135deg, #141e30, #243b55);
}
</style>
</head>

<body>

<button id="modeToggle">🌙</button>

<div class="quiz-container">
  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <h2 id="question">Question</h2>
  <div id="answers"></div>

  <button id="nextBtn">Next</button>
</div>

<script>
const questions = [
  {
    question: "HTML ka full form kya hai?",
    answers: ["Hyper Text Markup Language", "High Tech Modern Language", "Home Tool Mark Language"],
    correct: 0
  },
  {
    question: "CSS kis liye use hota hai?",
    answers: ["Design", "Programming", "Database"],
    correct: 0
  },
  {
    question: "JavaScript kya hai?",
    answers: ["Styling", "Programming Language", "Browser"],
    correct: 1
  }
];

let index = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");

function loadQuestion() {
  answered = false;
  nextBtn.style.display = "none";

  const q = questions[index];
  questionEl.textContent = q.question;
  answersEl.innerHTML = "";

  q.answers.forEach((ans, i) => {
    const btn = document.createElement("button");
    btn.textContent = ans;
    btn.classList.add("option");

    btn.onclick = () => selectAnswer(btn, i, q.correct);

    answersEl.appendChild(btn);
  });

  updateProgress();
}

function selectAnswer(btn, selected, correct) {
  if (answered) return;
  answered = true;

  const buttons = document.querySelectorAll(".option");

  buttons.forEach((b, i) => {
    if (i === correct) {
      b.classList.add("correct");
    } else {
      b.classList.add("wrong");
    }
  });

  if (selected === correct) score++;

  nextBtn.style.display = "block";
}

nextBtn.onclick = () => {
  index++;
  if (index < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
};

function updateProgress() {
  progressBar.style.width = ((index) / questions.length) * 100 + "%";
}

function showResult() {
  document.querySelector(".quiz-container").innerHTML = `
    <h2>Your Score: ${score}/${questions.length}</h2>
    <button onclick="location.reload()">Restart</button>
  `;
}

/* Dark Mode */
const toggleBtn = document.getElementById("modeToggle");

toggleBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");

  toggleBtn.textContent =
    document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
});

/* Start */
loadQuestion();
</script>

</body>
</html>
