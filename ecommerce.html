<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Store</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body {
  background: #111;
  color: #fff;
}

/* NAVBAR */
header {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: #000;
}

header a {
  color: white;
  margin-left: 15px;
  text-decoration: none;
}

/* HERO */
.hero {
  text-align: center;
  padding: 80px 20px;
}

.hero h1 {
  font-size: 2.5rem;
}

.hero button {
  margin-top: 20px;
  padding: 10px 20px;
  background: orange;
  border: none;
  cursor: pointer;
}

/* PRODUCTS */
.products {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 40px;
  flex-wrap: wrap;
}

.card {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  width: 250px;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

.card button {
  margin-top: 10px;
  padding: 8px 15px;
  background: orange;
  border: none;
  cursor: pointer;
}

/* CONTACT */
.contact {
  text-align: center;
  padding: 40px;
  background: #000;
}

/* RESPONSIVE */
@media(max-width: 768px) {
  header {
    flex-direction: column;
    align-items: center;
  }

  .products {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header>
  <h2>Ali Store</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Modern E-commerce Website</h1>
  <p>Shop the latest products with style</p>
  <button onclick="scrollToProducts()">Shop Now</button>
</section>

<!-- PRODUCTS -->
<section id="products" class="products">

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Product 1</h3>
    <p>$20</p>
    <button onclick="addToCart('Product 1')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Product 2</h3>
    <p>$35</p>
    <button onclick="addToCart('Product 2')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Product 3</h3>
    <p>$50</p>
    <button onclick="addToCart('Product 3')">Add to Cart</button>
  </div>

</section>

<!-- CONTACT -->
<section id="contact" class="contact">
  <h2>Contact Me</h2>
  <p>Email: ali@email.com</p>
</section>

<script>
function scrollToProducts() {
  document.getElementById("products").scrollIntoView({
    behavior: "smooth"
  });
}

function addToCart(product) {
  alert(product + " added to cart!");
}
</script>

</body>
</html>
