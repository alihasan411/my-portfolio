<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial;
      background: #ffffff;
      color: #111;
      transition: 0.3s;
    }

    /* DARK MODE */
    body.dark {
      background: #0f172a;
      color: white;
    }

    /* NAV */
    nav {
      background: #14b8a6;
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* TOGGLE BUTTON */
    #modeToggle {
      position: fixed;
      top: 60px;
      left: 10px;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: #14b8a6;
      color: white;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 30px;
    }

    .hero button {
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #14b8a6;
      color: white;
    }

    /* PROJECTS */
    .projects {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      width: 90%;
      max-width: 300px;
      background: #eee;
      padding: 10px;
      border-radius: 10px;
    }

    body.dark .card {
      background: #1e293b;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card h3 {
      margin-top: 10px;
    }

    .card button {
      margin-top: 5px;
      padding: 6px;
      border: none;
      border-radius: 6px;
      background: #14b8a6;
      color: white;
    }

    /* CONTACT */
    .contact {
      padding: 20px;
    }

    input, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #ddd;
    }

    body.dark input,
    body.dark textarea {
      background: #1e293b;
      color: white;
    }

    .send-btn {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #14b8a6;
      color: white;
    }
  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#">Home</a>
  <a href="#">Projects</a>
  <a href="#">Contact</a>
</nav>

<button id="modeToggle">🌙</button>

<!-- HERO -->
<section class="hero">
  <h1>Hi, I'm Ali</h1>
  <p>Front-End Developer</p>
  <button>View My Work</button>
</section>

<!-- PROJECTS -->
<section class="projects">

  <div class="card">
    <img src="https://picsum.photos/300/200">
    <h3>Project 1</h3>
    <p>Simple project description</p>
    <button>GitHub</button>
    <button>View</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/201">
    <h3>Project 2</h3>
    <p>Simple project description</p>
    <button>GitHub</button>
    <button>View</button>
  </div>

</section>

<!-- CONTACT -->
<section class="contact">
  <h2>Contact Me</h2>
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <textarea placeholder="Your Message"></textarea>
  <button class="send-btn">Send</button>
</section>

<script>
  const btn = document.getElementById("modeToggle");

  btn.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
      btn.innerHTML = "☀️";
    } else {
      btn.innerHTML = "🌙";
    }
  });
</script>

</body>
</html>
