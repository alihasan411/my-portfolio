<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Portfolio</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg, #0f172a, #020617, #0f766e, #020617);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
  color: white;
  transition: 0.3s;
}

/* DARK MODE */
body.dark-mode {
  background: #ffffff;
  color: black;
}

/* BG ANIMATION */
@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* NAVBAR */
nav {
  margin: 10px;
  padding: 12px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(20, 184, 166, 0.3);
  display: flex;
  justify-content: center;
  gap: 25px;
}

nav a {
  text-decoration: none;
  color: inherit;
  font-weight: 600;
  position: relative;
}

/* NAV HOVER */
nav a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  background: #14b8a6;
  left: 0;
  bottom: -5px;
  transition: 0.3s;
}

nav a:hover::after {
  width: 100%;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(135deg, #141e30, #243b55);
  padding: 20px;
  position: relative;
}

.hero-content h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.hero-content h2 {
  font-size: 20px;
  color: #00e5ff;
  height: 25px;
  margin-bottom: 20px;
}

/* BUTTON */
.btn {
  padding: 12px 25px;
  background: #00e5ff;
  color: black;
  border-radius: 25px;
  text-decoration: none;
}

/* TOGGLE BUTTON FIX */
#modeToggle {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #00e5ff;
  border: none;
  padding: 10px;
  border-radius: 50%;
  cursor: pointer;
}

/* PROJECTS GRID FIX */
.projects {
  display: grid;
  grid-template-columns: 1fr;
  gap: 25px;
  padding: 40px 20px;
  justify-items: center;
}

/* DESKTOP GRID */
@media (min-width: 768px) {
  .projects {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 1024px) {
  .projects {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* CARD */
.project-card {
  width: 100%;
  max-width: 320px;
  border-radius: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transition: 0.4s;
  text-align: center;
}

.project-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 0 25px rgba(20,184,166,0.5);
}

/* IMAGE */
.img-box {
  position: relative;
  aspect-ratio: 16/9;
  overflow: hidden;
  border-radius: 10px;
}

.img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.img-box:hover img {
  transform: scale(1.08);
}

/* TAG */
.tag {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #00bcd4;
  color: white;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 12px;
}

/* OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: 0.3s;
}

.img-box:hover .overlay {
  opacity: 1;
}

.overlay a {
  background: #00bcd4;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  text-decoration: none;
}

/* CONTACT */
#contact {
  padding: 60px 20px;
  text-align: center;
}

.contact-form {
  max-width: 420px;
  margin: 40px auto;
  padding: 25px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.contact-form input,
.contact-form textarea {
  padding: 14px;
  border: none;
  border-radius: 12px;
  outline: none;
}

/* ANIMATION FIX */
.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: 0.6s ease;
}

.fade-in.show {
  opacity: 1;
  transform: translateY(0);
}

</style>
</head>

<body>

<nav>
  <a href="#hero">Home</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
</nav>

<section class="hero" id="hero">

<button id="modeToggle">🌙</button>

<div class="hero-content">
  <h1>Hi, I'm Ali 👋</h1>
  <h2 id="typing"></h2>
  <a href="#projects" class="btn">View My Work</a>
</div>

</section>

<section id="projects" class="projects fade-in">

<!-- CARD -->
<div class="project-card fade-in">
  <div class="img-box">
    <span class="tag">Planner</span>
    <img src="IMG-20260502-WA0003.jpg">
    <div class="overlay">
      <a href="smart-daily-planner.html" target="_blank">Live Demo</a>
    </div>
  </div>
  <h3>Smart Daily Planner</h3>
</div>

<div class="project-card fade-in">
  <div class="img-box">
    <span class="tag">Quiz</span>
    <img src="creatvise-qOA1-UjXxSc-unsplash.jpg">
    <div class="overlay">
      <a href="smart-quiz-app.html" target="_blank">Live Demo</a>
    </div>
  </div>
  <h3>Quiz App</h3>
</div>

</section>

<section id="contact" class="fade-in">

<h2>Contact Me</h2>

<form class="contact-form">
  <input type="text" placeholder="Your Name" required>
  <input type="email" placeholder="Your Email" required>
  <textarea placeholder="Your Message"></textarea>
  <button type="submit">Send Message</button>
</form>

</section>

<script>

/* FADE */
const elements = document.querySelectorAll('.fade-in');

window.addEventListener('scroll', () => {
  elements.forEach(el => {
    if (el.getBoundingClientRect().top < window.innerHeight - 100) {
      el.classList.add('show');
    }
  });
});

/* TYPING FIX */
const textArray = ["Frontend Developer", "Web Designer", "Creative Coder"];
let i = 0, j = 0, current = "", deleting = false;

function type() {
  current = textArray[i];

  if (!deleting) {
    document.getElementById("typing").textContent = current.slice(0, j++);
    if (j > current.length) {
      deleting = true;
      setTimeout(type, 1000);
      return;
    }
  } else {
    document.getElementById("typing").textContent = current.slice(0, j--);
    if (j === 0) {
      deleting = false;
      i = (i + 1) % textArray.length;
    }
  }

  setTimeout(type, deleting ? 50 : 100);
}
type();

/* TOGGLE FIX */
const toggleBtn = document.getElementById("modeToggle");

toggleBtn.onclick = () => {
  document.body.classList.toggle("dark-mode");
  toggleBtn.textContent =
    document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
};

</script>

</body>
</html>
