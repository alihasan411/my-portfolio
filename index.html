<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Portfolio</title>

  <style>
    /* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  transition: 0.4s;
}

/* LIGHT MODE */
body.dark {
  background: linear-gradient(135deg, #f1f5f9, #ffffff);
  color: #111;
}

/* NAVBAR */
nav {
  margin: 10px;
  padding: 12px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(20, 184, 166, 0.3);
  display: flex;
  justify-content: center;
  gap: 25px;
}

nav a {
  text-decoration: none;
  color: white;
  font-weight: 600;
}

/* TOGGLE */
#modeToggle {
  position: fixed;
  top: 80px;
  left: 15px;
  background: #14b8a6;
  border: none;
  padding: 10px;
  border-radius: 50%;
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 50px 20px;
}

.hero h1 {
  font-size: 26px;
  background: linear-gradient(90deg, #14b8a6, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}

/* PROJECTS */
.projects {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}

/* CARD */
.card {
  width: 100%;
  max-width: 320px;
  border-radius: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transition: 0.4s;
}

.card:hover {
  transform: translateY(-8px);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
}

/* BUTTON */
.card button {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  background: #14b8a6;
  color: white;
}

/* CONTACT */
.contact {
  padding: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}

/* DARK INPUT */
body:not(.dark) input,
body:not(.dark) textarea {
  background: #e2e8f0;
}

body.dark input,
body.dark textarea {
  background: #1e293b;
  color: white;
}
  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#">Home</a>
  <a href="#">Projects</a>
  <a href="#">Contact</a>
</nav>

<button id="modeToggle">🌙</button>

<!-- HERO -->
<section class="hero">
  <h1>Hi, I'm Ali</h1>
  <p>Front-End Developer</p>
  <button>View My Work</button>
</section>

<!-- PROJECTS -->
<section class="projects">

  <div class="card">
    <img src="https://picsum.photos/300/200">
    <h3>Project 1</h3>
    <p>Simple project description</p>
    <button>GitHub</button>
    <button>View</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/201">
    <h3>Project 2</h3>
    <p>Simple project description</p>
    <button>GitHub</button>
    <button>View</button>
  </div>

</section>

<!-- CONTACT -->
<section class="contact">
  <h2>Contact Me</h2>
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <textarea placeholder="Your Message"></textarea>
  <button class="send-btn">Send</button>
</section>

<script>
  const btn = document.getElementById("modeToggle");

  btn.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
      btn.innerHTML = "☀️";
    } else {
      btn.innerHTML = "🌙";
    }
  });
</script>

</body>
</html>
