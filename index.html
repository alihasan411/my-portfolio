<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Portfolio</title>

  <style>
    /* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  transition: 0.4s;
}

/* LIGHT MODE */
body.dark {
  background: linear-gradient(135deg, #f1f5f9, #ffffff);
  color: #111;
}

/* NAVBAR */
nav {
  margin: 10px;
  padding: 12px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(20, 184, 166, 0.3);
  display: flex;
  justify-content: center;
  gap: 25px;
}

nav a {
  text-decoration: none;
  color: white;
  font-weight: 600;
}

/* TOGGLE */
#modeToggle {
  position: fixed;
  top: 80px;
  left: 15px;
  background: #14b8a6;
  border: none;
  padding: 10px;
  border-radius: 50%;
  color: white;
}

/* HERO */
/* HERO SECTION */
.hero {
  min-height: 90vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* HERO CONTENT */
.hero-content {
  max-width: 500px;
}

/* HEADING */
.hero h1 {
  font-size: 28px;
  background: linear-gradient(90deg, #14b8a6, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
  margin-bottom: 10px;

animation: floatText 3s ease-in-out infinite;
}

/* KEYFRAMES */
@keyframes floatText {
  0% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-10px);
  }
  100% {
    transform: translateY(0px);
  }
}

/* TEXT */
.hero p {
  font-size: 15px;
  opacity: 0.8;
  margin-bottom: 20px;
}

/* BUTTONS */
.hero-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
}

/* BUTTON STYLE */
.hero button {
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(45deg, #14b8a6, #22d3ee);
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

/* HOVER */
.hero button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(20,184,166,0.5);
}

/* PROJECTS */
.projects {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}

/* CARD */
.card {
  width: 100%;
  max-width: 320px;
  border-radius: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transition: 0.4s;
}

.card:hover {
  transform: translateY(-8px);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
}

/* BUTTON */
.card button {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  background: #14b8a6;
  color: white;
}

/* CONTACT */
.contact {
  text-align: center;
  padding: 40px 20px;
}

/* SUB TEXT */
.contact-sub {
  opacity: 0.7;
  margin-bottom: 20px;
}

/* BOX */
.contact-box {
  max-width: 400px;
  margin: auto;
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.05);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* INPUT */
.contact-box input,
.contact-box textarea {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

/* FOCUS EFFECT */
.contact-box input:focus,
.contact-box textarea:focus {
  box-shadow: 0 0 10px #14b8a6;
}

/* BUTTON */
.send-btn {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(45deg, #14b8a6, #22d3ee);
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

/* HOVER */
.send-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(20,184,166,0.5);
}

/* DARK INPUT */
body:not(.dark) input,
body:not(.dark) textarea {
  background: #e2e8f0;
}

body.dark input,
body.dark textarea {
  background: #1e293b;
  color: white;
}


/* FADE IN */
.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: 0.8s;
}

/* SHOW ANIMATION */
.show {
  opacity: 1;
  transform: translateY(0);
}

/* CARD HOVER GLOW */
.card:hover {
  box-shadow: 0 0 25px rgba(20,184,166,0.5);
}

/* IMAGE ZOOM */
.card img {
  transition: 0.4s;
}

.card:hover img {
  transform: scale(1.08);
}

/* BUTTON HOVER */
button:hover {
  transform: scale(1.05);
}

/* NAV HOVER LINE */
nav a {
  position: relative;
}

nav a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  background: #14b8a6;
  left: 0;
  bottom: -5px;
  transition: 0.3s;
}

nav a:hover::after {
  width: 100%;
}


/* ANIMATED BACKGROUND */
body {
  background: linear-gradient(-45deg, #0f172a, #020617, #0f766e, #020617);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}



body {
  animation: fadePage 1s ease;
}

@keyframes fadePage {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}


#typing::after {
  content: "|";
  animation: blink 0.7s infinite;
}

@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}


  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#hero">Home</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
</nav>

<button id="modeToggle">🌙</button>

<!-- HERO -->
<section id="hero" class="hero fade-in">

  <div class="hero-content">
    <h1><span id="typing"></span></h1>

    <p>I build modern and responsive websites</p>

    <div class="hero-buttons">
      <button onclick="goProjects()">🚀 View My Work</button>
      <button onclick="goContact()">📩 Contact Me</button>
    </div>

  </div>

</section>

<!-- PROJECTS -->
<section id="projects" class="projects fade-in">

  <div class="card fade-in">
   <img src="IMG-20260502-WA0003.jpg">
    <h3>Project 1</h3>
    <p>Simple project description</p>
    <button onclick="openGit()">GitHub</button>
<button onclick="openLive()">View</button>
  </div>

  <div class="card">
   <img src="IMG-20260502-WA0003.jpg">
    <h3>Project 2</h3>
    <p>Simple project description</p>
   <button onclick="openGit()">GitHub</button>
<button onclick="openLive()">View</button>
  </div>



<div class="card fade-in">
  <img src="IMG-20260502-WA0003.jpg">
  <h3>Todo App</h3>
  <p>Task manager app</p>

  <button onclick="openTodo()">View</button>
</div>



<div class="card fade-in">
  <img src="IMG-20260502-WA0003.jpg">
  <h3>Calculator App</h3>
  <p>Simple calculator using HTML, CSS, JS</p>

  <button onclick="openCalc()">View</button>
</div>




<div class="card fade-in">
  <img src="IMG-20260502-WA0003.jpg">
  <h3>Weather App</h3>
  <p>Live weather app</p>

  <button onclick="openWeather()">View</button>
</div>



</section>

<!-- CONTACT -->
<section id="contact" class="contact fade-in">

  <h2>📩 Contact Me</h2>
  <p class="contact-sub">Let's work together</p>

  <div class="contact-box">
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea placeholder="Your Message"></textarea>

    <button class="send-btn" onclick="sendMsg()">Send Message 🚀</button>
  </div>

</section>

<script>

  const btn = document.getElementById("modeToggle");

btn.addEventListener("click", () => {
  document.body.classList.toggle("dark");

  // icon change
  if (document.body.classList.contains("dark")) {
    btn.innerHTML = "☀️";
  } else {
    btn.innerHTML = "🌙";
  }
});


const elements = document.querySelectorAll('.fade-in');

window.addEventListener('scroll', () => {
  elements.forEach(el => {
    const top = el.getBoundingClientRect().top;

    if (top < window.innerHeight - 100) {
      el.classList.add('show');
    }
  });
});





const texts = [
  "Hi, I'm Ali 👋",
  "I'm a Frontend Developer 💻",
  "I build modern websites 🚀"
];

let count = 0;
let index = 0;
let currentText = "";
let letter = "";

function type() {

  if (count === texts.length) {
    count = 0;
  }

  currentText = texts[count];
  letter = currentText.slice(0, ++index);

  document.getElementById("typing").innerHTML = letter;

  if (letter.length === currentText.length) {
    setTimeout(() => {
      erase();
    }, 1500);
  } else {
    setTimeout(type, 80);
  }
}

function erase() {
  if (index > 0) {
    letter = currentText.slice(0, --index);
    document.getElementById("typing").innerHTML = letter;
    setTimeout(erase, 40);
  } else {
    count++;
    setTimeout(type, 300);
  }
}

type();





function goProjects() {
  document.querySelector(".projects").scrollIntoView({
    behavior: "smooth"
  });
}



function openGit() {
  window.open("https://github.com/", "_blank");
}

function openLive() {
  window.open("https://example.com", "_blank");
}



function sendMsg() {
  alert("Message sent (demo)");
}




function openTodo() {
  window.open("todo.html", "_blank");
}


function openCalc() {
  window.open("calculator.html", "_blank");
}




function openWeather() {
  window.open("weather.html", "_blank");
}


function goProjects() {
  document.querySelector("#projects").scrollIntoView({
    behavior: "smooth"
  });
}

function goContact() {
  document.querySelector("#contact").scrollIntoView({
    behavior: "smooth"
  });
}


window.addEventListener("load", () => {
  document.querySelectorAll(".fade-in").forEach(el => {
    el.classList.add("show");
  });
});


</script>


</body>
</html>
