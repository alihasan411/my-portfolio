<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Portfolio</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg, #0f172a, #020617, #0f766e, #020617);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
  color: white;
  transition: 0.3s;
}

/* DARK MODE */
body.dark-mode {
  background: #ffffff;
  color: #111;
}

/* BG */
@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* NAV */
nav {
  margin: 10px;
  padding: 12px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(20, 184, 166, 0.3);
  display: flex;
  justify-content: center;
  gap: 25px;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero-content {
  animation: fadeUp 1s ease forwards;
}

.hero h1 {
  font-size: 32px;
}

.hero h2 {
  color: #00e5ff;
  height: 30px;
  margin: 10px 0;
}

/* HERO ANIMATION */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* BUTTON */
.btn {
  padding: 12px 25px;
  background: #00e5ff;
  color: black;
  border-radius: 25px;
  text-decoration: none;
}

/* TOGGLE */
#modeToggle {
  position: fixed;
  top: 15px;
  right: 15px;
  border: none;
  padding: 10px;
  border-radius: 50%;
  cursor: pointer;
}

/* PROJECTS */
.projects {
  padding: 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

/* CARD */
.project-card {
  width: 300px;
  padding: 15px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  text-align: center;
  transition: 0.3s;
}

.project-card:hover {
  transform: translateY(-8px);
}

/* IMAGE */
.img-box {
  position: relative;
  aspect-ratio: 16/9;
  overflow: hidden;
}

.img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ANIMATION */
.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: 0.6s;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#hero">Home</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
</nav>

<!-- HERO -->
<section class="hero" id="hero">

<button id="modeToggle">🌙</button>

<div class="hero-content">
  <h1>Hi, I'm Ali 👋</h1>
  <h2 id="typing"></h2>
  <a href="#projects" class="btn">View My Work</a>
</div>

</section>

<!-- PROJECTS -->
<section id="projects" class="projects">

<div class="project-card fade-in">
  <div class="img-box">
    <img src="IMG-20260502-WA0003.jpg">
  </div>
  <h3>Smart Daily Planner</h3>
</div>

<div class="project-card fade-in">
  <div class="img-box">
    <img src="creatvise-qOA1-UjXxSc-unsplash.jpg">
  </div>
  <h3>Smart Quiz App</h3>
</div>

<div class="project-card fade-in">
  <div class="img-box">
    <img src="jonathan-borba-0Nrq6UvFpI8-unsplash.jpg">
  </div>
  <h3>Todo App</h3>
</div>

<div class="project-card fade-in">
  <div class="img-box">
    <img src="cardmapr-nl-tvzykmBf3r0-unsplash.jpg">
  </div>
  <h3>Calculator</h3>
</div>

<div class="project-card fade-in">
  <div class="img-box">
    <img src="raychan-cFiQbSH7-RY-unsplash.jpg">
  </div>
  <h3>Weather App</h3>
</div>

</section>

<!-- CONTACT -->
<section id="contact" style="padding:40px;text-align:center;">
  <h2>Contact Me</h2>
</section>

<script>

/* TYPING */
const words = ["Frontend Developer","Web Designer","Creative Coder"];
let i=0,j=0,del=false;

function type(){
  let el=document.getElementById("typing");
  let w=words[i];

  if(!del){
    el.textContent=w.substring(0,j++);
    if(j>w.length){del=true;setTimeout(type,1000);return;}
  } else {
    el.textContent=w.substring(0,j--);
    if(j===0){del=false;i=(i+1)%words.length;}
  }
  setTimeout(type,del?50:100);
}
type();

/* TOGGLE */
document.getElementById("modeToggle").onclick=()=>{
  document.body.classList.toggle("dark-mode");
};

/* SCROLL ANIMATION */
window.addEventListener("scroll",()=>{
  document.querySelectorAll(".fade-in").forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight-100){
      el.classList.add("show");
    }
  });
});

</script>

</body>
</html>
