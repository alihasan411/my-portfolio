<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Portfolio</title>

  <style>
    /* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  transition: 0.4s;
}

/* LIGHT MODE */
body.dark {
  background: linear-gradient(135deg, #f1f5f9, #ffffff);
  color: #111;
}

/* NAVBAR */
nav {
  margin: 10px;
  padding: 12px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(20, 184, 166, 0.3);
  display: flex;
  justify-content: center;
  gap: 25px;
}

nav a {
  text-decoration: none;
  color: white;
  font-weight: 600;
}

/* TOGGLE */
#modeToggle {
  position: fixed;
  top: 80px;
  left: 15px;
  background: #14b8a6;
  border: none;
  padding: 10px;
  border-radius: 50%;
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 50px 20px;
}

.hero h1 {
  font-size: 26px;
  background: linear-gradient(90deg, #14b8a6, #22d3ee);
  -webkit-background-clip: text;
  color: transparent;
}

/* PROJECTS */
.projects {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}

/* CARD */
.card {
  width: 100%;
  max-width: 320px;
  border-radius: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transition: 0.4s;
}

.card:hover {
  transform: translateY(-8px);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
}

/* BUTTON */
.card button {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  background: #14b8a6;
  color: white;
}

/* CONTACT */
.contact {
  padding: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}

/* DARK INPUT */
body:not(.dark) input,
body:not(.dark) textarea {
  background: #e2e8f0;
}

body.dark input,
body.dark textarea {
  background: #1e293b;
  color: white;
}


/* FADE IN */
.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: 0.8s;
}

/* SHOW ANIMATION */
.show {
  opacity: 1;
  transform: translateY(0);
}

/* CARD HOVER GLOW */
.card:hover {
  box-shadow: 0 0 25px rgba(20,184,166,0.5);
}

/* IMAGE ZOOM */
.card img {
  transition: 0.4s;
}

.card:hover img {
  transform: scale(1.08);
}

/* BUTTON HOVER */
button:hover {
  transform: scale(1.05);
}

/* NAV HOVER LINE */
nav a {
  position: relative;
}

nav a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  background: #14b8a6;
  left: 0;
  bottom: -5px;
  transition: 0.3s;
}

nav a:hover::after {
  width: 100%;
}


/* ANIMATED BACKGROUND */
body {
  background: linear-gradient(-45deg, #0f172a, #020617, #0f766e, #020617);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}



body {
  animation: fadePage 1s ease;
}

@keyframes fadePage {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#hero">Home</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
</nav>

<button id="modeToggle">🌙</button>

<!-- HERO -->
<section id="hero" class="hero fade-in">
  <h1><span id="typing"></span></h1>
  <p>Front-End Developer</p>
  <button onclick="goProjects()">View My Work</button>
</section>

<!-- PROJECTS -->
<section id="projects" class="projects fade-in">

  <div class="card fade-in">
    <img src="https://picsum.photos/300/200">
    <h3>Project 1</h3>
    <p>Simple project description</p>
    <button onclick="openGit()">GitHub</button>
<button onclick="openLive()">View</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/201">
    <h3>Project 2</h3>
    <p>Simple project description</p>
   <button onclick="openGit()">GitHub</button>
<button onclick="openLive()">View</button>
  </div>

</section>

<!-- CONTACT -->
<section id="contact" class="contact fade-in">
  <h2>Contact Me</h2>
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <textarea placeholder="Your Message"></textarea>
  <button class="send-btn" onclick="sendMsg()">Send</button>
</section>

<script>
  const btn = document.getElementById("modeToggle");

  btn.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
      btn.innerHTML = "☀️";
    } else {
      btn.innerHTML = "🌙";
    }
  });


const elements = document.querySelectorAll('.fade-in');

window.addEventListener('scroll', () => {
  elements.forEach(el => {
    const top = el.getBoundingClientRect().top;

    if (top < window.innerHeight - 100) {
      el.classList.add('show');
    }
  });
});



const text = "Hi, I'm Ali - Frontend Developer";
let i = 0;

function typing() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typing, 80);
  }
}

typing();




function goProjects() {
  document.querySelector(".projects").scrollIntoView({
    behavior: "smooth"
  });
}



function openGit() {
  window.open("https://github.com/", "_blank");
}

function openLive() {
  window.open("https://example.com", "_blank");
}



function sendMsg() {
  alert("Message sent (demo)");
}
</script>

</body>
</html>
